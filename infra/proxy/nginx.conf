worker_processes 1;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $request_method $cors_preflight {
    default 0;
    OPTIONS 1;
  }

  server {
    listen 80;

    add_header 'Access-Control-Allow-Origin'  '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    add_header 'Access-Control-Max-Age'       '86400' always;

    if ($cors_preflight) {
      return 204;
    }

    # ---------- /api/device ----------
    location /api/device/ {
      set $up device:3000;
      rewrite ^/api/device/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /api/edge ----------
    location /api/edge/ {
      set $up edge:3000;
      rewrite ^/api/edge/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /api/core-1 ----------
    location /api/core-1/ {
      set $up core-1:4000;
      rewrite ^/api/core-1/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /api/core-2 ----------
    location /api/core-2/ {
      set $up core-2:4000;
      rewrite ^/api/core-2/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /api/ml ----------
    location /api/ml/ {
      set $up core-ml:5000;
      rewrite ^/api/ml/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /api/cloud ----------
    location /api/cloud/ {
      set $up cloud:6000;
      rewrite ^/api/cloud/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /api/prom ----------
    location /api/prom/ {
      set $up prometheus:9090;
      rewrite ^/api/prom/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /api/grafana ----------
    location /api/grafana/ {
      set $up grafana:3000;
      rewrite ^/api/grafana/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- /admin ----------
    location /admin/ {
      set $up admin:7000;
      rewrite ^/admin/(.*)$ /$1 break;
      proxy_pass http://$up;
      proxy_set_header Host $host;
    }

    # ---------- health ----------
    location = /proxy-health {
      return 200 'proxy ok\n';
      add_header Content-Type text/plain;
    }
  }
}
