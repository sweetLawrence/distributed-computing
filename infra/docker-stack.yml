version: "3.8"

services:

  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: corepass
    volumes:
      - core-db-data:/var/lib/postgresql/data
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.core-side == true]
      resources:
        limits: { cpus: "0.50", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  cloud-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloudpass
    volumes:
      - cloud-db-data:/var/lib/postgresql/data
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.cloud-side == true]
      resources:
        limits: { cpus: "0.50", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  redis:
    image: redis:7-alpine
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 128M }
      restart_policy: { condition: any, delay: 5s }

  # ---------------- M9: message broker for store-and-forward ----------------
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.worker2 == true]
      resources:
        limits: { cpus: "0.50", memory: 640M }
      restart_policy: { condition: any, delay: 5s }

  # ---------------- M10: name server / service registry ----------------
  consul:
    image: hashicorp/consul:1.19
    command: >
      agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
      -data-dir=/consul/data
      -bind='{{ GetPrivateInterfaces | exclude "network" "172.16.0.0/12" | attr "address" }}'
    ports:
      - target: 8500
        published: 8500
        mode: host
    volumes:
      - consul-data:/consul/data
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "1.00", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

  device:
    image: dep-device:latest
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    environment:
      EDGE_URL: http://edge:3000
      CSV_PATH: /data/smartwear_health_monitoring_dataset.csv
      STREAM_INTERVAL_MS: 200
      MAX_ROWS: 200
    volumes:
      - /vagrant/data:/data:ro
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.core-side == true]
      resources:
        limits: { cpus: "0.25", memory: 128M }
      restart_policy: { condition: any, delay: 5s }

  edge:
    image: dep-edge:latest
    ports:
      - target: 3000
        published: 3001
        mode: ingress
    environment:
      REPLICA_ID: edge-{{.Task.Slot}}
      CORE_1_URL: http://core-1:4000
      CORE_2_URL: http://core-2:4000
      PLACEMENT_THRESHOLD: 0.005
      FORCE_FORWARD: "0"
      CORE_HEARTBEAT_MS: 3000
      EDGE_BUFFER: "1"
      NAMING_MODE: static
      KAFKA_BROKERS: kafka:9092
      CONSUL_URL: http://consul:8500
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks: [appnet]
    # M9: a new replica gets traffic only after /health answers 200
    # (live service also has --health-start-interval 1s for fast readiness)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      # tuned: gentle once running, so a busy replica is not mistaken for a dead one
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      update_config: { order: start-first }
      resources:
        limits: { cpus: "0.25", memory: 160M }
      restart_policy: { condition: any, delay: 5s }

  core-1:
    image: dep-core:latest
    ports:
      - target: 4000
        published: 4001
        mode: ingress
    environment:
      REPLICA_ID: core-1
      PORT: 4000
      CORE_DB_HOST: core-db
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASS: corepass
      CLOUD_DB_HOST: cloud-db
      CLOUD_DB_PORT: 5432
      CLOUD_DB_NAME: cloud
      CLOUD_DB_USER: cloud
      CLOUD_DB_PASS: cloudpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_URL: http://core-ml:5000
      LEADER_TTL_MS: 10000
      KAFKA_BROKERS: kafka:9092
      CONSUL_URL: http://consul:8500
      DRAIN_ENABLED: "1"
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.core-side == true]
      resources:
        limits: { cpus: "0.50", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

  core-2:
    image: dep-core:latest
    ports:
      - target: 4000
        published: 4002
        mode: ingress
    environment:
      REPLICA_ID: core-2
      PORT: 4000
      CORE_DB_HOST: core-db
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASS: corepass
      CLOUD_DB_HOST: cloud-db
      CLOUD_DB_PORT: 5432
      CLOUD_DB_NAME: cloud
      CLOUD_DB_USER: cloud
      CLOUD_DB_PASS: cloudpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_URL: http://core-ml:5000
      LEADER_TTL_MS: 10000
      KAFKA_BROKERS: kafka:9092
      CONSUL_URL: http://consul:8500
      DRAIN_ENABLED: "1"
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.cloud-side == true]
      resources:
        limits: { cpus: "0.50", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

  core-ml:
    image: dep-core-ml:latest
    ports:
      - target: 5000
        published: 5000
        mode: ingress
    volumes:
      - /vagrant/data:/data:ro
    networks: [appnet]
    # M9: ready only when it accepts connections, so migration is make-before-break
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',5000),2)"]
      interval: 3s
      timeout: 2s
      retries: 2
      start_period: 10s
    deploy:
      replicas: 1
      update_config: { order: start-first }
      placement:
        constraints: [node.labels.cloud-side == true]
      resources:
        limits: { cpus: "1.00", memory: 1G }
      restart_policy: { condition: any, delay: 5s }

  cloud:
    image: dep-cloud:latest
    ports:
      - target: 6000
        published: 6000
        mode: ingress
    environment:
      CORE_DB_HOST: core-db
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASS: corepass
      CLOUD_DB_HOST: cloud-db
      CLOUD_DB_PORT: 5432
      CLOUD_DB_NAME: cloud
      CLOUD_DB_USER: cloud
      CLOUD_DB_PASS: cloudpass
      BATCH_INTERVAL_MS: 60000
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 128M }
      restart_policy: { condition: any, delay: 5s }

  nginx-edge:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8080
        mode: ingress
    configs:
      - source: nginx_edge_conf_v3
        target: /etc/nginx/nginx.conf
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 64M }
      restart_policy: { condition: any, delay: 5s }

  prometheus:
    image: prom/prometheus:latest
    ports:
      - target: 9090
        published: 9090
        mode: ingress
    configs:
      - source: prometheus_cfg_v1
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1d'
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.50", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [appnet]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.25", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

  grafana:
    image: grafana/grafana:latest
    ports:
      - target: 3000
        published: 3030
        mode: ingress
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - /vagrant/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - /vagrant/infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "1.00", memory: 1G }
      restart_policy: { condition: any, delay: 5s }

  proxy:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8090
        mode: ingress
    configs:
      - source: proxy_conf_v5
        target: /etc/nginx/nginx.conf
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 64M }
      restart_policy: { condition: any, delay: 5s }

  admin:
    image: dep-admin:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /vagrant/infra/docker-stack.yml:/stack/docker-stack.yml:ro
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 64M }
      restart_policy: { condition: any, delay: 5s }

volumes:
  grafana-data:
  core-db-data:
  cloud-db-data:
  kafka-data:
  consul-data:

networks:
  appnet:
    attachable: true

configs:
  nginx_edge_conf_v3:
    file: ./nginx-edge/nginx.conf
  prometheus_cfg_v1:
    file: ./prometheus/prometheus.yml
  proxy_conf_v5:
    file: ./proxy/nginx.conf
