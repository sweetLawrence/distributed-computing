version: "3.8"

services:

  # ---------- data stores ----------
  core-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: corepass
    volumes:
      - core-db-data:/var/lib/postgresql/data
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.core-side == true]
      resources:
        limits: { cpus: "0.50", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  cloud-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloudpass
    volumes:
      - cloud-db-data:/var/lib/postgresql/data
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.cloud-side == true]
      resources:
        limits: { cpus: "0.50", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  redis:
    image: redis:7-alpine
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 128M }
      restart_policy: { condition: any, delay: 5s }

  # ---------- application ----------
  device:
    image: dep-device:latest
    ports:
      - target: 3000
        published: 3000
        mode: ingress
    environment:
      EDGE_URL: http://edge:3000
      CSV_PATH: /data/smartwear_health_monitoring_dataset.csv
      STREAM_INTERVAL_MS: 200
      MAX_ROWS: 200
    volumes:
      - /home/vboxuser/distributed-edge-platform/data:/data:ro
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.core-side == true]
      resources:
        limits: { cpus: "0.25", memory: 128M }
      restart_policy: { condition: any, delay: 5s }

  edge:
    image: dep-edge:latest
    ports:
      - target: 3000
        published: 3001
        mode: ingress
    environment:
      REPLICA_ID: edge-{{.Task.Slot}}
      CORE_1_URL: http://core-1:4000
      CORE_2_URL: http://core-2:4000
      PLACEMENT_THRESHOLD: 0.005
      FORCE_FORWARD: "0"
      CORE_HEARTBEAT_MS: 3000
    networks: [appnet]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.25", memory: 128M }
      restart_policy: { condition: any, delay: 5s }

  core-1:
    image: dep-core:latest
    ports:
      - target: 4000
        published: 4001
        mode: ingress
    environment:
      REPLICA_ID: core-1
      PORT: 4000
      CORE_DB_HOST: core-db
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASS: corepass
      CLOUD_DB_HOST: cloud-db
      CLOUD_DB_PORT: 5432
      CLOUD_DB_NAME: cloud
      CLOUD_DB_USER: cloud
      CLOUD_DB_PASS: cloudpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_URL: http://core-ml:5000
      LEADER_TTL_MS: 10000
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.core-side == true]
      resources:
        limits: { cpus: "0.50", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

  core-2:
    image: dep-core:latest
    ports:
      - target: 4000
        published: 4002
        mode: ingress
    environment:
      REPLICA_ID: core-2
      PORT: 4000
      CORE_DB_HOST: core-db
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASS: corepass
      CLOUD_DB_HOST: cloud-db
      CLOUD_DB_PORT: 5432
      CLOUD_DB_NAME: cloud
      CLOUD_DB_USER: cloud
      CLOUD_DB_PASS: cloudpass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_URL: http://core-ml:5000
      LEADER_TTL_MS: 10000
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.cloud-side == true]
      resources:
        limits: { cpus: "0.50", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

  core-ml:
    image: dep-core-ml:latest
    ports:
      - target: 5000
        published: 5000
        mode: ingress
    volumes:
      - /home/vboxuser/distributed-edge-platform/data:/data:ro
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.cloud-side == true]
      resources:
        limits: { cpus: "1.00", memory: 1G }
      restart_policy: { condition: any, delay: 5s }

  cloud:
    image: dep-cloud:latest
    ports:
      - target: 6000
        published: 6000
        mode: ingress
    environment:
      CORE_DB_HOST: core-db
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASS: corepass
      CLOUD_DB_HOST: cloud-db
      CLOUD_DB_PORT: 5432
      CLOUD_DB_NAME: cloud
      CLOUD_DB_USER: cloud
      CLOUD_DB_PASS: cloudpass
      BATCH_INTERVAL_MS: 60000
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 128M }
      restart_policy: { condition: any, delay: 5s }

  nginx-edge:
    image: nginx:alpine
    ports:
      - target: 80
        published: 8080
        mode: ingress
    configs:
      - source: nginx_edge_conf_v3
        target: /etc/nginx/nginx.conf
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.25", memory: 64M }
      restart_policy: { condition: any, delay: 5s }

  prometheus:
    image: prom/prometheus:latest
    ports:
      - target: 9090
        published: 9090
        mode: ingress
    configs:
      - source: prometheus_cfg_v1
        target: /etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1d'
    networks: [appnet]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.manager == true]
      resources:
        limits: { cpus: "0.50", memory: 512M }
      restart_policy: { condition: any, delay: 5s }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [appnet]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "0.25", memory: 256M }
      restart_policy: { condition: any, delay: 5s }

volumes:
  core-db-data:
  cloud-db-data:

networks:
  appnet:
    attachable: true
configs:
  nginx_edge_conf_v3:
    file: ./nginx-edge/nginx.conf

  prometheus_cfg_v1:
    file: ./prometheus/prometheus.yml
